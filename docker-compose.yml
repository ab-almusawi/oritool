version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: oritool-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-oritool}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oritool-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oritool-backend
    restart: always
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-oritool}
      JWT_SECRET: ${JWT_SECRET:-changethissecretin production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - oritool-network
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oritool-frontend
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - oritool-network
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:

networks:
  oritool-network:
    driver: bridge
